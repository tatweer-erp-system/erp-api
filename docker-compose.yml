version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: erp-app
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    networks:
      - erp-network

  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: erp_shared
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp_user -d erp_shared']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  redis-cache:
    image: redis:7-alpine
    container_name: erp-redis-cache
    ports:
      - '6379:6379'
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  redis-queue:
    image: redis:7-alpine
    container_name: erp-redis-queue
    ports:
      - '6380:6379'
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

volumes:
  postgres-data:
  redis-cache-data:
  redis-queue-data:

networks:
  erp-network:
    driver: bridge
